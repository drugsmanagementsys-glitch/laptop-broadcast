<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Office Broadcast Board</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes pulse-border {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
      50% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
    }
    .urgent-pulse {
      animation: pulse-border 2s infinite;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between font-sans">

  <header class="bg-white border-b border-slate-200 px-6 py-4 flex flex-wrap items-center justify-between gap-4 shadow-sm">
    <div class="flex items-center gap-3">
      <div id="status-dot" class="w-3 h-3 rounded-full bg-amber-400"></div>
      <h1 class="text-lg font-semibold text-slate-800 tracking-tight">Broadcast Notice Board</h1>
      <span id="connection-text" class="text-xs font-medium px-2.5 py-0.5 rounded-full bg-amber-50 text-amber-700 border border-amber-200">
        Connecting...
      </span>
    </div>

    <div class="flex items-center gap-3">
      <button id="enable-alerts-btn" onclick="requestPermissions()" class="text-xs font-medium bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 px-3 py-1.5 rounded-lg transition">
        🔔 Enable Sound & Popups
      </button>
      <button onclick="toggleAdminPanel()" class="text-xs font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg transition">
        ⚙️ Admin Controls
      </button>
    </div>
  </header>

  <main class="flex-grow flex items-center justify-center p-6">
    <div id="message-card" class="max-w-3xl w-full bg-emerald-50/70 border-2 border-emerald-200 rounded-2xl p-8 md:p-12 shadow-sm text-center transition-all duration-300">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/80 text-emerald-800 text-xs font-semibold uppercase tracking-wider mb-6 border border-emerald-200" id="urgency-badge">
        ● Normal Notice
      </div>
      
      <h2 id="display-message" class="text-3xl md:text-5xl font-bold text-slate-900 leading-tight break-words">
        No active announcements right now.
      </h2>
      
      <p id="display-timestamp" class="mt-6 text-sm text-slate-500">
        Waiting for broadcast...
      </p>
    </div>
  </main>

  <section id="admin-panel" class="hidden bg-white border-t border-slate-200 p-6 shadow-lg">
    <div class="max-w-3xl mx-auto">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-base font-bold text-slate-800">📢 Send Live Broadcast to All Laptops</h3>
        <button onclick="toggleAdminPanel()" class="text-xs text-slate-400 hover:text-slate-600">Close ✕</button>
      </div>
      
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Announcement Message</label>
          <textarea id="admin-input" rows="2" placeholder="Type your message here..." 
            class="w-full rounded-xl border border-slate-300 p-3 text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
        </div>

        <div class="flex flex-wrap items-center justify-between gap-4">
          <div class="flex items-center gap-4">
            <label class="text-xs font-semibold text-slate-600 uppercase">Priority Level:</label>
            <select id="admin-priority" class="rounded-lg border border-slate-300 px-3 py-1.5 text-sm bg-white text-slate-700">
              <option value="normal">🟢 Normal (Soft Green)</option>
              <option value="important">🟡 Important (Warm Amber)</option>
              <option value="urgent">🔴 Urgent (Alert Red + Chime)</option>
            </select>
          </div>

          <div class="flex items-center gap-2">
            <button onclick="clearBroadcast()" class="px-4 py-2 rounded-xl text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 transition">
              Clear Screen
            </button>
            <button onclick="sendBroadcast()" class="px-6 py-2 rounded-xl text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 shadow-sm transition">
              🚀 Broadcast Now
            </button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw5Xj7IkcmBppzDesQ9lI5DoU5W4gaRn1KszouJyQYDaEX1L90HA4ONgRYnXmHLVoTF/exec";
    let lastSeenId = null;

    function setConnectedState(active) {
      const dot = document.getElementById('status-dot');
      const label = document.getElementById('connection-text');
      if (active) {
        dot.className = "w-3 h-3 rounded-full bg-emerald-500";
        label.className = "text-xs font-medium px-2.5 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200";
        label.textContent = "Live Sync Active";
      } else {
        dot.className = "w-3 h-3 rounded-full bg-rose-500";
        label.className = "text-xs font-medium px-2.5 py-0.5 rounded-full bg-rose-50 text-rose-700 border border-rose-200";
        label.textContent = "Check Script URL";
      }
    }

    async function pollMessages() {
      if (!SCRIPT_URL.startsWith("https://script.google.com/")) {
        setConnectedState(false);
        return;
      }
      try {
        const res = await fetch(`${SCRIPT_URL}?t=${Date.now()}`);
        const data = await res.json();
        setConnectedState(true);

        if (data.id && String(data.id) !== String(lastSeenId)) {
          const isInitialLoad = lastSeenId === null;
          lastSeenId = data.id;

          if (data.cleared) {
            renderMessage("No active announcements right now.", "normal", null, false);
          } else {
            renderMessage(data.text, data.priority, data.timestamp, !isInitialLoad);
          }
        }
      } catch (err) {
        console.error("Poll error:", err);
        setConnectedState(false);
      }
    }

    async function sendBroadcast() {
      const text = document.getElementById('admin-input').value.trim();
      const priority = document.getElementById('admin-priority').value;
      if (!text) return alert("Please enter a message first.");

      const payload = {
        text: text,
        priority: priority,
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        clear: false
      };

      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        body: JSON.stringify(payload)
      });

      document.getElementById('admin-input').value = '';
      setTimeout(pollMessages, 600);
    }

    async function clearBroadcast() {
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        body: JSON.stringify({ clear: true })
      });
      setTimeout(pollMessages, 600);
    }

    function renderMessage(text, priority, time, triggerAlert) {
      const card = document.getElementById('message-card');
      const badge = document.getElementById('urgency-badge');
      const msgEl = document.getElementById('display-message');
      const timeEl = document.getElementById('display-timestamp');

      msgEl.textContent = text;
      timeEl.textContent = time ? `Sent at ${time}` : "Waiting for broadcast...";

      card.className = "max-w-3xl w-full border-2 rounded-2xl p-8 md:p-12 shadow-sm text-center transition-all duration-300";
      badge.className = "inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/90 text-xs font-semibold uppercase tracking-wider mb-6 border";

      if (priority === 'urgent') {
        card.classList.add('bg-rose-50', 'border-rose-300', 'urgent-pulse');
        badge.classList.add('text-rose-700', 'border-rose-200');
        badge.textContent = "🚨 Urgent Alert";
      } else if (priority === 'important') {
        card.classList.add('bg-amber-50', 'border-amber-300');
        badge.classList.add('text-amber-800', 'border-amber-200');
        badge.textContent = "⚠️ Important Notice";
      } else {
        card.classList.add('bg-emerald-50/70', 'border-emerald-200');
        badge.classList.add('text-emerald-800', 'border-emerald-200');
        badge.textContent = "
